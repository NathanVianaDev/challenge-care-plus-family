<!DOCTYPE html>
<html lang="pt-br" class="bg-light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Care Plus</title>

    <!-- Bootstrap & Fontes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Global e CSS Específico da Tela (SoC aplicado) -->
    <link rel="stylesheet" href="../../CSS/Style.CSS">
    <link rel="stylesheet" href="../../CSS/FormCompacto.css">

    <script type="module" src="/assets/js/LayoutGlobal.js"></script>
    <script type="module" src="../../Components/MenssagemExterna/MenssagemExterna.js"></script>
</head>

<body class="bg-light">

    <main class="container my-3">

        <!-- Lógica de grade: Centralizado, limitando a 8 colunas no Desktop -->
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 col-sm-12">

                <!-- CAIXA FLUTUANTE ÚNICA -->
                <div class="unified-profile-card">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="profile-main-title">Configurações do Perfil</h2>
                        <span class="badge status-badge">Conta Ativa</span>
                    </div>

                    <form>
                        <!-- ==========================================
                        SEÇÃO: INFORMAÇÕES PESSOAIS
                        ========================================== -->
                        <h4 class="section-title" style="margin-top: 0;">Dados Pessoais</h4>
                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="field-label">Nome Completo</label>
                                <input type="text" class="editable-input" value="Harry Potter">
                            </div>
                            <div class="col-md-4">
                                <label class="field-label">CPF</label>
                                <input type="text" class="editable-input" value="000.000.009-34">
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Data de Nascimento</label>
                                <input type="date" class="editable-input" value="1980-07-31">
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Gênero</label>
                                <select class="editable-input">
                                    <option value="Masculino" selected>Masculino</option>
                                    <option value="Feminino">Feminino</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </div>
                        </div>

                        <!-- ==========================================
                        SEÇÃO: CONTATO
                        ========================================== -->
                        <h4 class="section-title">Contato</h4>
                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <label class="field-label">E-mail</label>
                                <input type="email" class="editable-input" value="Potter.Harry@email.com">
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Telefone Celular</label>
                                <input type="tel" class="editable-input" value="(51) 90000-0034">
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Telefone de Recado</label>
                                <input type="tel" class="editable-input" value="(51) 90000-0035">
                            </div>
                        </div>

                        <!-- ==========================================
                        SEÇÃO: ENDEREÇO
                        ========================================== -->
                        <h4 class="section-title">Endereço</h4>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="field-label">CEP</label>
                                <input type="text" class="editable-input" value="00000-934">
                            </div>
                            <div class="col-md-8">
                                <label class="field-label">Logradouro</label>
                                <input type="text" class="editable-input" value="Little Whinging">
                            </div>
                            <div class="col-md-4">
                                <label class="field-label">Número</label>
                                <input type="text" class="editable-input" value="1578">
                            </div>
                            <div class="col-md-8">
                                <label class="field-label">Complemento</label>
                                <input type="text" class="editable-input" value="Apto 101, Bloco B">
                            </div>
                            <div class="col-md-8">
                                <label class="field-label">Cidade</label>
                                <input type="text" class="editable-input" value="Surrey">
                            </div>
                            <div class="col-md-4">
                                <label class="field-label">Estado</label>
                                <input type="text" class="editable-input" value="ENGLAND">
                            </div>
                        </div>

                        <!-- ==========================================
                        SEÇÃO: SEGURANÇA
                        ========================================== -->
                        <h4 class="section-title">Segurança e Acesso</h4>
                        <div class="row g-3 mb-5">
                            <div class="col-12">
                                <label class="field-label">Senha Atual</label>
                                <input type="password" class="editable-input" value="********">
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Nova Senha</label>
                                <input type="password" class="editable-input" placeholder="Digite para alterar">
                            </div>
                            <div class="col-md-6">
                                <label class="field-label">Confirmar Nova Senha</label>
                                <input type="password" class="editable-input" placeholder="Confirme a nova senha">
                            </div>
                        </div>

                        <!--==========================================
                        RODAPÉ DO FORMULÁRIO (BOTÃO SALVAR)
                        ========================================== -->
                        <div class="d-flex justify-content-end align-items-center pt-3"
                            style="border-top: 1px solid #f0f2f5;">
                            <!-- Botão de Cancelar (Recarrega a página) -->
                            <a href="javascript:window.location.reload()" class="btn-cancelar">Cancelar</a>

                            <!-- Botão Verde de Salvar com redirecionamento -->
                            <button type="button" class="btn-salvar-perfil" onclick="executarSalvamento()">
                                Salvar Alterações
                            </button>
                        </div>

                    </form>

                </div> <!-- FIM CAIXA FLUTUANTE -->

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica para o Web Component MenssagemExterna -->
    <script>
        function executarSalvamento() {
            const alerta = document.createElement('menssagem-externa');
            
            // Atributos baseados no seu componente
            alerta.setAttribute('titulo', 'Perfil Atualizado!');
            alerta.setAttribute('texto', 'Seus dados pessoais foram salvos com sucesso no sistema Care Plus.');
            alerta.setAttribute('link', '/assets/Pages/HomePageLogado/HomePageLogado.html');
            alerta.setAttribute('botao', 'Voltar para Home');

            document.body.appendChild(alerta);
        }
    </script>

</body>

</html>
