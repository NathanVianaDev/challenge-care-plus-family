<!DOCTYPE html>
<html lang="pt-br" class="bg-light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/CSS/Style.CSS">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/Components/CardConsulta/CardConsulta.css">
    <!-- HomePageLogado.css é importado aqui porque o modal de encaixes
         compartilha os mesmos estilos definidos na home do beneficiário -->
    <link rel="stylesheet" href="/assets/CSS/HomePage/HomePageLogado.css">
    <link rel="stylesheet" href="/assets/Components/BotaoVoltar/BotaoVoltar.css">
    <title>Agendamentos</title>

    <script type="module" src="../../Components/BotaoVoltar/BotaoVoltar.js"></script>
    <script type="module" src="/assets/Components/CardConsulta/CardConsulta.js"></script>
    <script type="module" src="/assets/js/LayoutGlobal.js"></script>
</head>

<body class="bg-light">
    <main class="container my-3 my-md-5">

        <div class="card shadow-sm border-0 p-3 p-md-5 mx-auto"
            style="max-width: 65rem; border-radius: 20px; background-color: white;">
            <div class="row g-3 mb-5">
                <div class="col-12 col-md-4">
                    <botao-voltar texto="Voltar" href="../HomePageLogado/HomePageLogado.html"></botao-voltar>
                </div>
                <div class="col-12 col-md-8 d-flex align-items-center justify-content-center justify-content-md-start">
                    <h2 class="mb-4 fw-bold text-center text-md-start">Meus Agendamentos</h2>
                </div>
            </div>
            <div class="row g-3 mb-5">

                <div class="col-12 col-md-4">
                    <a href="/assets/Pages/PainelAgendamento/PainelAgendamento.html" class="text-decoration-none">
                        <button class="btn rounded-pill fw-bold py-2 w-100 text-white"
                            style="background-color: #3aadde; border: none;">
                            NOVA CONSULTA
                        </button>
                    </a>
                </div>

                <div class="col-12 col-md-4">
                    <a href="/assets/Pages/CancelarConsulta/CancelarConsulta.html" class="text-decoration-none">
                        <button class="btn rounded-pill fw-bold py-2 w-100 text-white"
                            style="background-color: #ff5c5c; border: none;">
                            CANCELAR CONSULTA
                        </button>
                    </a>
                </div>

                <div class="col-12 col-md-4">
                    <button id="btn-meus-encaixes" class="btn rounded-pill fw-bold py-2 w-100 text-white"
                        style="background-color: #f39c12; border: none;">
                        MEUS ENCAIXES
                    </button>
                </div>

            </div>

            <div id="secao-consultas">

            <card-consulta dia="05" mes="JUN" especialidade="Cardiologia" profissional="Dr. Roberto Silva"
                horario="09:30" modo="detalhes"
                endereco="Rua Luís Coelho, 223 Térreo | Bairro Consolação - São Paulo - SP"
                contato="(11) 99640-2599"></card-consulta>

            <card-consulta dia="17" mes="JUN" especialidade="Dermatologia" profissional="Dr. Roberto Silva"
                horario="14:30" modo="detalhes"
                endereco="Alameda Araguaia, 871 Térreo | Bairro Alphaville - Barueri - SP"
                contato="(11) 99640-2599"></card-consulta>

            <card-consulta dia="27" mes="JUN" especialidade="Cardiologia" profissional="Dr. Roberto Silva"
                horario="09:30" modo="detalhes"
                endereco="Rua Luís Coelho, 223 Térreo | Bairro Consolação - São Paulo - SP"
                contato="(11) 99640-2599"></card-consulta></div>

        </div>
    </main>

    <!-- A lógica deste modal é controlada por HomePageLogado.js,
         reutilizado entre as páginas de agendamento -->
    <div id="modalMeusEncaixes" class="modal-overlay hidden">
        <div class="custom-modal">
            <img src="/assets/Images/logo-care-plus.png" alt="Care Plus" class="modal-logo">
            <h3 class="modal-title">Meus Encaixes Solicitados</h3>
            <p id="mensagemEncaixe" class="modal-message"></p>

            <div class="d-flex gap-3 justify-content-center">
                <button id="btnDesistirEncaixe" class="btn btn-desistir rounded-pill fw-bold px-4 py-2">
                    Desistir do Encaixe
                </button>
                <button id="btnFecharEncaixe" class="btn btn-fechar-encaixe rounded-pill fw-bold px-4 py-2">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/assets/js/HomePageLogado.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/script.js"></script>
</body>

</html>
