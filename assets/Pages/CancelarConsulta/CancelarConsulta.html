<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Consultas | Care Plus</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Componentes Globais -->
    <script type="module" src="/assets/js/LayoutGlobal.js"></script>
    <link rel="stylesheet" href="../../Components/BotaoVoltar/BotaoVoltar.css">
    <link rel="stylesheet" href="../../Components/CardConsulta/CardConsulta.css">
    <script type="module" src="../../Components/BotaoVoltar/BotaoVoltar.js"></script>
    <script type="module" src="../../Components/ModalAlerta/ModalAlerta.js"></script>
    <script type="module" src="/assets/Components/Calendario/Calendario.js"></script>

<link rel="stylesheet" href="../../Components/CardConsulta/CardConsulta.css">

</head>
<body class="bg-light">

    <main class="container my-5">
        <botao-voltar texto="Voltar ao Painel" href="../HomePageLogado/HomePageLogado.html"></botao-voltar>

        <div class="row mt-4 gap-4 gap-lg-0">
            <!-- COLUNA ESQUERDA: Calendário -->
            <div class="col-lg-4">
                <p class="text-muted mb-2">Escolha uma data:</p>
                <div class="card shadow-sm border-0 p-4" style="border-radius: 20px;">
                    <calendario-dinamico></calendario-dinamico>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <button class="btn btn-sm btn-light border-0"><i class="bi bi-chevron-left"></i></button>
                            <button class="btn btn-sm btn-light border-0"><i class="bi bi-chevron-right"></i></button>
                        </div>
                    </div>
                    
                </div>
            </div>

            <!-- COLUNA DIREITA: Lista de Consultas -->
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-end mb-4">
                    <h2 class="fw-light m-0">Próximas <span class="fw-bold">Consultas</span></h2>
                    <a href="#" class="text-decoration-none fw-bold" style="color: #29b6f6; font-size: 0.9rem;">VER TODAS</a>
                </div>

                <div id="lista-consultas">
                    <!-- As consultas serão injetadas via JavaScript para podermos validar as datas -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Nativo do Bootstrap para Motivo do Cancelamento -->
    <div class="modal fade" id="modalMotivoCancelamento" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px; border: none;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Motivo do Cancelamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Por favor, informe o motivo para cancelar esta consulta.</p>
                    <textarea id="texto-motivo" class="form-control" rows="3" placeholder="Ex: Imprevisto no trabalho..."></textarea>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Voltar</button>
                    <button type="button" id="btn-confirmar-cancelamento" class="btn btn-danger rounded-pill px-4">Confirmar Cancelamento</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Nosso Componente Customizado de Alerta -->
    <modal-alerta id="alerta-global"></modal-alerta>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/GerenciarConsultas.js"></script>
</body>
</html>
