<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Consultas | Care Plus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script type="module" src="/assets/js/LayoutGlobal.js"></script>
    <link rel="stylesheet" href="../../Components/BotaoVoltar/BotaoVoltar.css">
    <link rel="stylesheet" href="../../Components/CardConsulta/CardConsulta.css">
    <script type="module" src="../../Components/BotaoVoltar/BotaoVoltar.js"></script>
    <script type="module" src="../../Components/ModalAlerta/ModalAlerta.js"></script>
    <script type="module" src="/assets/Components/Calendario/Calendario.js"></script>
    <script type="module" src="../../Components/CardConsulta/CardConsulta.js"></script>
    <!-- HomePageLogado.css é importado aqui porque o modal de encaixes
         compartilha os mesmos estilos definidos na home do beneficiário -->
    <link rel="stylesheet" href="/assets/CSS/HomePage/HomePageLogado.css">


</head>

<body class="bg-light">
    <main class="container my-3 my-md-5">

        <div class="card shadow-sm border-0 p-3 p-md-5 mx-auto"
            style="max-width: 65rem; border-radius: 20px; background-color: white;">
            <div class="row g-3 mb-5">
                <div class="col-12 col-md-3">
                    <botao-voltar texto="Voltar" href="../HomePageLogado/HomePageLogado.html"></botao-voltar>
                </div>
                <div class="col-12 col-md-8 d-flex align-items-center justify-content-center justify-content-md-start">
                    <h2 class="mb-4 fw-bold text-center text-md-start">Remarque <span class="fw-light m-0">ou</span> Cancele <span class="fw-light m-0">suas Consultas</span></h2>
                </div>
            </div>
            <div class="row g-3 mb-5 d-flex justify-content-center">

                <div class="col-12 col-md-4">
                    <a href="/assets/Pages/PainelAgendamento/PainelAgendamento.html" class="text-decoration-none">
                        <button class="btn rounded-pill fw-bold py-2 w-100 text-white"
                            style="background-color: #3aadde; border: none;">
                            NOVA CONSULTA
                        </button>
                    </a>
                </div>

                <div class="col-12 col-md-4">
                    <button id="btn-meus-encaixes" class="btn rounded-pill fw-bold py-2 w-100 text-white"
                        style="background-color: #f39c12; border: none;">
                        MEUS ENCAIXES
                    </button>
                </div>

            </div>

            <div id="">
                    <card-consulta modo="edicao" status="aguardando" especialidade="Cardiologia"
                        profissional="Dr. Roberto Silva" dia="05" mes="JUN" horario="09:30">
                    </card-consulta>
                    <card-consulta modo="edicao" status="confirmado" especialidade="Dermatologia"
                        profissional="Dra. Ana" dia="17" mes="JUN" horario="14:30">
                    </card-consulta>
                    <card-consulta modo="edicao" status="aguardando" especialidade="Cardiologia"
                        profissional="Dr. Roberto Silva" dia="27" mes="JUN" horario="09:30">
                    </card-consulta>
                </div>

        </div>
    </main>

    <!-- Estrutura do Modal de Encaixes (Gerenciado pelo HomePageLogado.js) -->
    <div id="modalMeusEncaixes" class="modal-overlay hidden">
        <div class="custom-modal">
            <img src="/assets/Images/logo-care-plus.png" alt="Care Plus" class="modal-logo">
            <h3 class="modal-title">Meus Encaixes Solicitados</h3>
            <p id="mensagemEncaixe" class="modal-message"></p>

            <div class="d-flex gap-3 justify-content-center">
                <button id="btnDesistirEncaixe" class="btn btn-desistir rounded-pill fw-bold px-4 py-2">
                    Desistir do Encaixe
                </button>
                <button id="btnFecharEncaixe" class="btn btn-fechar-encaixe rounded-pill fw-bold px-4 py-2">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/assets/js/HomePageLogado.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/GerenciarConsultas.js"></script>
</body>

</html>
