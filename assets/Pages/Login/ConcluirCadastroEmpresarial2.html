<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concluir Cadastro Empresa | Care Plus Family</title>

    <!-- Google Fonts e Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS dos Componentes e Estilo Externo -->
    <link rel="stylesheet" href="/assets/CSS/Style2.CSS">
    <link rel="stylesheet" href="/assets/Components/FooterCare/FooterCare.css">
    <link rel="stylesheet" href="/assets/Components/CampoForm/CampoForm.css">

    <!-- Scripts dos Componentes -->
    <script type="module" src="/assets/Components/FooterCare/FooterCare.js"></script>
    <script type="module" src="/assets/Components/CampoForm/CampoForm.js"></script>
</head>
<body class="body-cadastro">

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center my-3">
        <div class="glass-container w- p-4 p-md-2" style="max-width: 800px;">
            
            <div class="text-center mb-4">
                <img src="../../Images/logo-care-plus.png" alt="Care Plus Family" class="logo-img-cadastro mx-auto">
                <h3 class="titulo-formulario mt-3">Conclua o cadastro da empresa</h3>
                <p class="text-muted small">Preencha os dados de localização e identificação para finalizar.</p>
            </div>

            <form id="form-concluir-empresa">
                <div class="row g-3">
                    <!-- Coluna da Esquerda -->
                    <div class="col-md-6">
                        <campo-form id-campo="input-cep" titulo-form="CEP" tipo="text" legenda="Informe o CEP"></campo-form>
                        <campo-form id-campo="input-logradouro" titulo-form="Logradouro" tipo="text" legenda="Nome da rua/avenida"></campo-form>
                        <campo-form id-campo="input-estado" titulo-form="Estado" tipo="text" legenda="Informe o estado"></campo-form>
                        <campo-form id-campo="input-logo-empresa" titulo-form="Logotipo" tipo="file" legenda="Logo da empresa"></campo-form>
                    </div>

                    <!-- Coluna da Direita -->
                    <div class="col-md-6">
                        <campo-form id-campo="input-numero-endereco" titulo-form="Número" tipo="text" legenda="Nº"></campo-form>
                        <campo-form id-campo="input-complemento" titulo-form="Complemento" tipo="text" legenda="Casa/Apt/Bloco"></campo-form>
                        <campo-form id-campo="input-cidade" titulo-form="Cidade" tipo="text" legenda="Informe a cidade"></campo-form>
                        <campo-form id-campo="input-nome-fantasia" titulo-form="Nome Fantasia" tipo="text" legenda="Nome da empresa"></campo-form>
                    </div>
                </div>

                <div class="mt-5 text-center">
                    <a href="/assets/Pages/HomePageLogado/HomePageLogado.html" class="text-decoration-none">
                        <button type="button" class="btn-cadastrar" style="max-width: 300px;">
                            Concluir Cadastro
                        </button>
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Discreto -->
    <footer class="footer-discreto">
        <div class="container text-center">
            <p class="m-0">© 2026 Care Plus Family. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
