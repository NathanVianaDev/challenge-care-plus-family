<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/CSS/Style.CSS">
    <link rel="stylesheet" href="./assets/CSS/Navbar.CSS">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Home Page</title>

    <link rel="stylesheet" href="./assets/Components/CardConsulta/CardConsulta.css">
    <script type="module">
        import { CardConsulta } from './assets/Components/CardConsulta/CardConsulta.js';
    </script>
    <!--Menu Header-->
    <script type="module">
        import { MeuHeader } from './assets/Components/HeaderLogado/Header.js';
    </script>

    <!--Calendario-->
    <script type="module">
        import {CalendarioDinamico} from './assets/Components/Calendario/Calendario.js';
    </script>

</head>

<body>
    <!--Menu Header-->
    <meu-header></meu-header>
    <!--Menu Header-->
    <main class="container my-5">
        <div class="row">
            <div class="col-lg-4">
                <div class="card p-5 text-center mb-4" id="perfil">
                    <div class="text-start mb-2">
                        <button class="btn btn-link text-dark p-0" id="btn-config">
                            <i class="bi bi-gear-fill" style="font-size: 1.5rem;"></i>
                        </button>
                    </div>
                    <div class="position-relative d-inline-block mx-auto mb-3">
                        <div class="profile-ring">
                            <img src="./assets/Images/avatar-padrao.png" id="user-photo"
                                class="rounded-circle shadow-sm" alt="Perfil">
                        </div>
                    </div>
                    <h3 class="fw-light">Bem Vindo, <span id="display-name" class="fw-bold">Usuário</span>.</h3>
                </div>

<!--Calendario-->
                <div>
                    <calendario-dinamico></calendario-dinamico>
                </div>
<!--Calendario-->
            </div>
            <div class="col-lg-8">
                <div id="hub-monitoramento" class="mb-4">
                    <div class="titulo-hub" id="monitoramento">
                        <h2 class="mb-4 text-center">Hub de Monitoramento</h2>
                    </div>
                    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-3">

                        <div class="col">
                            <div class="card-hub borda-verde text-center h-100 shadow-sm" id="passos">
                                <div class="card-header-custom pt-2">
                                    <p class="text-muted fw-bold mb-0 small text-uppercase">Passos</p>
                                </div>

                                <div class="card-value-container">
                                    <div class="donut-wrapper">
                                        <svg class="progress-ring" width="100" height="100">
                                            <circle class="progress-ring__bg" stroke="#f0f2f5" stroke-width="8"
                                                fill="transparent" r="40" cx="50" cy="50" />
                                            <circle id="progresso-passos" class="progress-ring__bar" stroke="#92C444"
                                                stroke-width="8" stroke-linecap="round" fill="transparent" r="40"
                                                cx="50" cy="50"
                                                style="stroke-dasharray: 251; stroke-dashoffset: 125;" />
                                        </svg>
                                        <div class="donut-inner">
                                            <img src="./assets/Images/corredor.png" alt="Corredor"
                                                class="img-corredor-min">
                                            <h5 class="fw-bold mb-0" id="valor-passos-texto">4.5k</h5>
                                        </div>
                                    </div>
                                </div>

                                <div class="pb-3">
                                    <button class="btn-link-custom" id="btn-saiba-mais-passos">Saiba Mais</button>
                                </div>
                            </div>
                        </div>

                        <div class="col">
                            <div class="card-hub borda-laranja text-center h-100 shadow-sm" id="sono">
                                <div class="mb-2">
                                    <i class="bi bi-moon-stars-fill fs-2" style="color: #f39c12;"></i>
                                </div>
                                <p class="text-center fw-bold mb-4 small text-uppercase titulo-hub">Sono</p>

                                <div class="card-value-container">
                                    <h4 class="fw-bold mb-0" id="horas-sono">7h 20m</h4>
                                </div>

                                <div class="card-footer-spacer" style="height: 20px;"></div>

                            </div>
                        </div>

                        <div class="col">
                            <div class="card-hub borda-azul-claro text-center h-100 shadow-sm" id="agua">
                                <div class="mb-2">
                                    <i class="bi bi-droplet-fill fs-2" style="color: #00d2ff;"></i>
                                </div>
                                <p class="text-center fw-bold mb-4 small text-uppercase titulo-hub">Água</p>

                                <div class="card-value-container">
                                    <h4 class="fw-bold mb-0" id="litros-agua">1.2 <small class="fw-light">L</small>
                                        <h4>
                                </div>

                                <div class="card-footer-spacer" style="height: 20px;"></div>

                            </div>
                        </div>

                        <div class="col">
                            <div class="card-hub borda-roxa text-center h-100 shadow-sm" id="glicemia">
                                <div class="mb-2">
                                    <i class="bi bi-droplet-half fs-2" style="color: #9b59b6;"></i>
                                </div>
                                <p class="text-center fw-bold mb-1 small text-uppercase titulo-hub">Glicemia</p>
                                <div class="card-value-container">
                                    <h4 class="fw-bold mb-0" id="litros-agua"> 95 <small class="fw-light">mg/dL</small>
                                        <h4>
                                </div>
                                <div class="card-footer-spacer" style="height: 20px;">
                                </div>
                            </div>
                        </div>

                        <div class="col">
                            <div class="card-hub borda-azul text-center h-100 shadow-sm" id="batimentos">
                                <div class="mb-2">
                                    <i class="bi bi-heart-pulse-fill fs-2" style="color: #3aadde;"></i>
                                </div>
                                <p class="text-center fw-bold mb-1 small text-uppercase titulo-hub">Batimentos</p>

                                <div class="card-value-container">
                                    <h4 class="fw-bold mb-0"> <span id="valor-bpm">82</span> <small
                                            class="fw-light text-muted">bpm</small></h4>
                                </div>
                                <div class="card-footer-spacer" style="height: 20px;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="secao-consultas">
                    <div class="d-flex justify-content-between align-items-center mb-">
                        <h2 class="text-center my-3">Próximas Consultas</h2>
                        <button class="btn btn-sm fw-bold" style="color: #3aadde; background: none; border: none;">VER
                            TODAS</button>
                    </div>

                    <div>
                    <card-consulta 
                        dia="05" 
                        mes="MAR" 
                        especialidade="Cardiologia" 
                        profissional="Dr. Roberto Silva" 
                        horario="09:30">
                    </card-consulta>                        
                    </div>
                    <div>
                        <card-consulta 
                            dia="17" 
                            mes="MAR" 
                            especialidade="Cardiologia" 
                            profissional="Dr. Roberto Silva" 
                            horario="14:30">
                        </card-consulta>
                    </div>
                    <card-consulta 
                        dia="25" 
                        mes="MAR" 
                        especialidade="Cardiologia" 
                        profissional="Dr. Roberto Silva" 
                        horario="09:30">
                    </card-consulta>
                    </div>
            </div>
        </div>
        
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="/assets/js/script.js"></script>
</body>
</html>
